org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Mapbox's Android plugin contains Kotlin sources and requires AGP's built-in Kotlin.
android.builtInKotlin=true
# Avoid Kotlin incremental-cache path errors when Pub packages and the project
# are located on different Windows drives (C: and D:).
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
